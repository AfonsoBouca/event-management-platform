  /events/{id}/polls:
    get:
      operationId: R307
      summary: "R307: List Event Polls"
      description: "Retrieve all polls for a specific event. Access: ATT, ORG"
      tags:
        - "M03: Comments and Interactions"
      parameters:
        - in: path
          name: id
          description: Event ID
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: "Ok. Return list of polls."
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    pollId:
                      type: integer
                      example: 1
                    title:
                      type: string
                      example: "Should we extend the event by one hour?"
                    content:
                      type: string
                      example: "We're considering extending the event. What do you think?"
                    createdAt:
                      type: string
                      format: date-time
                      example: "2025-11-18T09:00:00Z"
                    eventId:
                      type: integer
                      example: 1
                    options:
                      type: array
                      items:
                        type: object
                        properties:
                          pollOptionId:
                            type: integer
                            example: 1
                          optionText:
                            type: string
                            example: "Yes"
                          voteCount:
                            type: integer
                            example: 45
        "401":
          description: "Unauthorized. User must be authenticated to view polls."
        "403":
          description: "Forbidden. Only event attendees and organizers can view polls."
        "404":
          description: "Not Found. Event does not exist."
        "500":
          description: "Internal Server Error. An error occurred while retrieving polls."

    post:
      operationId: R308
      summary: "R308: Create Poll"
      description: "Create a new poll for an event. Access: ORG"
      tags:
        - "M03: Comments and Interactions"
      parameters:
        - in: path
          name: id
          description: Event ID
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "Should we have a networking session?"
                content:
                  type: string
                  example: "Vote on whether we should include a 30-minute networking session."
                customOptions:
                  type: array
                  items:
                    type: string
                  example: []
                  description: Optional custom poll options (if empty, default Yes/No options are created by TRIGGER09)
              required:
                - title
                - content
      responses:
        "201":
          description: "Created. Poll created successfully with default or custom options."
          content:
            application/json:
              schema:
                type: object
                properties:
                  pollId:
                    type: integer
                    example: 1
                  title:
                    type: string
                    example: "Should we have a networking session?"
                  content:
                    type: string
                    example: "Vote on whether we should include a 30-minute networking session."
                  createdAt:
                    type: string
                    format: date-time
                    example: "2025-11-18T09:00:00Z"
                  eventId:
                    type: integer
                    example: 1
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        pollOptionId:
                          type: integer
                          example: 1
                        optionText:
                          type: string
                          example: "Yes"
        "400":
          description: "Bad Request. Invalid poll data provided or event is not in active period (BR18)."
        "401":
          description: "Unauthorized. User must be authenticated to create polls."
        "403":
          description: "Forbidden. Only event organizers can create polls (BR05)."
        "404":
          description: "Not Found. Event does not exist."
        "500":
          description: "Internal Server Error. An error occurred while creating the poll."

