          description: "Forbidden. Only the comment author can delete this comment (BR03)."
        "404":
          description: "Not Found. Comment does not exist."
        "409":
          description: "Conflict. Comment has child comments and cannot be deleted."
        "500":
          description: "Internal Server Error. An error occurred while deleting the comment."

  /comments/{id}/vote:
