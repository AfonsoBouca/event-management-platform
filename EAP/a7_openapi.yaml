  # M04: Reports System
  /reports:
    get:
      operationId: R401
      summary: 'R401: View My Reports'
      description: 'Show all reports submitted by the current user. Access: USR, ADM'
      tags:
        - 'M04: Reports System'
      responses:
        '200':
          description: 'Ok. Show list of user reports'
        '401':
          description: 'Unauthorized. User must be logged in'

    post:
      operationId: R402
      summary: 'R402: Create Report'
      description: 'Submit a new report for inappropriate content or behavior. Access: USR, ADM'
      tags:
        - 'M04: Reports System'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                report_type:
                  type: string
                  enum: [event, comment, user]
                  description: 'Type of content being reported'
                target_id:
                  type: integer
                  description: 'ID of the event, comment or user being reported'
                reason:
                  type: string
                  description: 'Reason for the report'
                description:
                  type: string
                  description: 'Detailed description of the issue'
              required:
                - report_type
                - target_id
                - reason
      responses:
        '302':
          description: 'Redirect after submitting report'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Report submitted successfully. Redirect to reports list.'
                  value: '/reports'
                302Error:
                  description: 'Failed to submit report. Redirect to report form.'
                  value: '/reports/new'

  /reports/new:
    get:
      operationId: R403
      summary: 'R403: New Report Form'
      description: 'Show form to create a new report. Access: USR, ADM'
      tags:
        - 'M04: Reports System'
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [event, comment, user]
          required: false
          description: 'Pre-select report type in form'
        - in: query
          name: target_id
          schema:
            type: integer
          required: false
          description: 'Pre-fill target ID in form'
      responses:
        '200':
          description: 'Ok. Show new report form'

  /reports/{id}:
    get:
      operationId: R404
      summary: 'R404: View Report Details'
      description: 'Show details of a specific report. Users can only view their own reports. Access: USR, ADM'
      tags:
        - 'M04: Reports System'
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: 'Report ID'
      responses:
        '200':
          description: 'Ok. Show report details'
        '403':
          description: 'Forbidden. User can only view own reports'
        '404':
          description: 'Report not found'

  /admin/reports:
    get:
      operationId: R405
      summary: 'R405: Admin - View All Reports'
      description: 'Show all reports in the system for administration. Access: ADM'
      tags:
        - 'M04: Reports System'
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, reviewed, resolved, dismissed]
          required: false
          description: 'Filter by report status'
        - in: query
          name: type
          schema:
            type: string
            enum: [event, comment, user]
          required: false
          description: 'Filter by report type'
      responses:
        '200':
          description: 'Ok. Show all reports for administration'
        '403':
          description: 'Forbidden. Admin access required'

  /admin/reports/{id}:
    get:
      operationId: R406
      summary: 'R406: Admin - View Report Details'
      description: 'Show detailed view of a report for administration. Access: ADM'
      tags:
        - 'M04: Reports System'
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: 'Report ID'
      responses:
        '200':
          description: 'Ok. Show admin report details'
        '404':
          description: 'Report not found'

    post:
      operationId: R407
      summary: 'R407: Admin - Update Report Status'
      description: 'Update the status and resolution of a report. Access: ADM'
      tags:
        - 'M04: Reports System'
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: 'Report ID'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, reviewed, resolved, dismissed]
                  description: 'New status of the report'
                admin_notes:
                  type: string
                  description: 'Administrator notes about the report'
                action_taken:
                  type: string
                  description: 'Description of actions taken'
              required:
                - status
      responses:
        '302':
          description: 'Redirect after updating report'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Report updated successfully. Redirect to admin reports.'
                  value: '/admin/reports'
                302Error:
                  description: 'Failed to update report. Redirect to report details.'
                  value: '/admin/reports/{id}'



