openapi: 3.0.0

info:
  version: "1.0"
  title: "LBAW MediaLibrary Web API"
  description: "Web Resources Specification (A7) for MediaLibrary"

servers:
  - url: http://lbaw25124.lbaw.fe.up.pt
    description: Production server

tags:
  - name: "M01: Authentication and User Profile"
  - name: "M02: Events"
  - name: "M03: Comments and Interactions"
  - name: "M04: Reports System"
  - name: "M05: User Administration"

paths:
  /login:
    get:
      operationId: R101
      summary: 'R101: Login Form'
      description: 'Provide login form. Access: PUB'
      tags:
        - 'M01: Authentication and User Profile'
      responses:
        '200':
          description: 'Ok. Show Log-in UI'
    post:
      operationId: R102
      summary: 'R102: Login Action'
      description: 'Processes the login form submission. Access: PUB'
      tags:
        - 'M01: Authentication and User Profile'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '302':
          description: 'Redirect after processing the login credentials.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Successful authentication. Redirect to user profile.'
                  value: '/users/{id}'
                302Error:
                  description: 'Failed authentication. Redirect to login form.'
                  value: '/login'

  /logout:
    post:
      operationId: R103
      summary: 'R103: Logout Action'
      description: 'Logout the current authenticated user. Access: USR, ADM'
      tags:
        - 'M01: Authentication and User Profile'
      responses:
        '302':
          description: 'Redirect after processing logout.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Successful logout. Redirect to login form.'
                  value: '/login'

  /register:
    get:
      operationId: R104
      summary: 'R104: Register Form'
      description: 'Provide new user registration form. Access: PUB'
      tags:
        - 'M01: Authentication and User Profile'
      responses:
        '200':
          description: 'Ok. Show Sign-Up UI'
    post:
      operationId: R105
      summary: 'R105: Register Action'
      description: 'Processes the new user registration form submission. Access: PUB'
      tags:
        - 'M01: Authentication and User Profile'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                password:
                  type: string
                email:
                  type: string
                picture:
                  type: string
                  format: binary
              required:
                - email
                - password
      responses:
        '302':
          description: 'Redirect after processing the new user information.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Successful authentication. Redirect to user profile.'
                  value: '/users/{id}'
                302Failure:
                  description: 'Failed authentication. Redirect to login form.'
                  value: '/login'

  /users/{id}:
    get:
      operationId: R106
      summary: 'R106: View user profile'
      description: 'Show the individual user profile. Access: USR'
      tags:
        - 'M01: Authentication and User Profile'
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: 'Ok. Show User Profile UI'

  /users/{id}/edit:
    get:
      operationId: R107
      summary: 'R107: Edit User information Form'
      description: 'Provide user form to update profile information. Access: USR, ADM'
      tags:
        - 'M01: Authentication and User Profile'
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: 'Ok. Show Edit User Profile Form'
        '403':
          description: 'Forbidden. User can only edit own profile'
    post:
      operationId: R108
      summary: 'R108: Edit User information Action'
      description: 'Processes the user profile update form submission. Access: USR, ADM'
      tags:
        - 'M01: Authentication and User Profile'
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                picture:
                  type: string
                  format: binary
              required:
                - name
                - email
      responses:
        '302':
          description: 'Redirect after processing the user information update.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Successful update. Redirect to user profile.'
                  value: '/users/{id}'
                302Error:
                  description: 'Failed update. Redirect to edit form.'
                  value: '/users/{id}/edit'

  /users/{id}/password:
    get:
      operationId: R109
      summary: 'R109: Change Password Form'
      description: 'Provide form to change user password. Access: USR, ADM'
      tags:
        - 'M01: Authentication and User Profile'
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: 'Ok. Show Change Password Form'
    post:
      operationId: R110
      summary: 'R110: Change Password Action'
      description: 'Processes the password change form submission. Access: USR, ADM'
      tags:
        - 'M01: Authentication and User Profile'
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                confirm_password:
                  type: string
              required:
                - current_password
                - new_password
                - confirm_password
      responses:
        '302':
          description: 'Redirect after processing the password change.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Successful password change. Redirect to user profile.'
                  value: '/users/{id}'
                302Error:
                  description: 'Failed password change. Redirect to password form.'
                  value: '/users/{id}/password'

  /users/{id}/calendar:
    get:
      operationId: R111
      summary: 'R111: View Personal Calendar'
      description: 'Show the personal calendar with all events the user is participating in. Access: USR'
      tags:
        - 'M01: Authentication and User Profile'
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
        - in: query
          name: month
          description: 'Month to display (1-12)'
          schema:
            type: integer
          required: false
        - in: query
          name: year
          description: 'Year to display'
          schema:
            type: integer
          required: false
      responses:
        '200':
          description: 'Ok. Show Personal Calendar UI'
          content:
            text/html:
              schema:
                type: string



  /events/search:
    get:
      operationId: R201
      summary: "R201: Search Public Events"
      description: "Returns a list of public events matching the search criteria. Access: PUB"

      tags:
        - "M02: Events"

      parameters:
        - in: query
          name: query
          description: String to use for full-text search
          schema:
            type: string
          required: false
        - in: query
          name: category
          description: Category of the events
          schema:
            type: string
          required: false
        - in: query
          name: tag
          description: Tag associated with the events
          schema:
            type: string
          required: false
      responses:
        "200":
          description: "Ok. Return list of events matching the search criteria."
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: "Tech Conference 2025"
                    description:
                      type: string
                      example: "Annual technology conference featuring latest innovations in AI and Machine Learning"
                    startDate:
                      type: string
                      format: date-time
                      example: "2025-12-01T09:00:00"
                    endDate:
                      type: string
                      format: date-time
                      example: "2025-12-03T18:00:00"
                    capacity:
                      type: integer
                      example: 500
                    price:
                      type: number
                      format: float
                      example: 150.00
                    isPublic:
                      type: boolean
                      example: true
                    location:
                      type: string
                      example: "Silicon Valley Convention Center, CA"
                    createdby:
                      type: integer
                      example: 1
                    eventStatus:
                      type: string
                      example: "Upcoming"
                    category:
                      type: string
                      example: "Technology"
                    tags:
                      type: array
                      items:
                        type: string
                      example: ["AI", "Machine Learning", "Innovation"]
  /events/createEvent:
    get:
      operationId: R202
      summary: "R202: Create Event Form"
      description: "Provide event creation form. Access: USR"
      tags:
        - "M02: Events"
      responses:
        "200":
          description: "Ok. Show Event Creation UI"
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: "Film Screening & Discussion"
                  description:
                    type: string
                    example: "An evening of independent film screenings followed by a panel discussion with filmmakers."
                  startDate:
                    type: string
                    format: date-time
                    example: "2025-11-15T19:00:00Z"
                  endDate:
                    type: string
                    format: date-time
                    example: "2025-11-15T22:00:00Z"
                  capacity:
                    type: integer
                    example: 150
                  price:
                    type: number
                    format: float
                    example: 20.00
                  isPublic:
                    type: boolean
                    example: true
                  location:
                    type: string
                    example: "Downtown Art House, NY"
                  eventStatus:
                    type: string
                    example: "Scheduled"
                  category:
                    type: string
                    example: "Arts & Culture"
                  tags:
                    type: array
                    items:
                      type: string
                    example: ["Film", "Discussion", "Independent"]

    post:
      operationId: R203
      summary: "R203: Create Event Action"
      description: "Processes the event creation form submission. Access: USR"
      tags:
        - "M02: Events"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                capacity:
                  type: integer
                price:
                  type: number
                  format: float
                isPublic:
                  type: boolean
                location:
                  type: string
                eventStatus:
                  type: string
                category:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: "Created. Event created successfully."
        "400":
          description: "Bad Request. Invalid event data provided."
        "401":
          description: "Unauthorized. User must be authenticated to create an event."
        "403":
          description: "Forbidden. User does not have permission to create events."
        "500":
          description: "Internal Server Error. An error occurred while processing the event creation."

  /events/{id}/edit:
    post:
      operationId: R204
      summary: "R204: Edit Event Action"
      description: "Processes the event editing. Access: ORG"
      tags:
        - "M02: Events"
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
                description:
                  type: string
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                capacity:
                  type: integer
                price:
                  type: number
                  format: float
                isPublic:
                  type: boolean
                location:
                  type: string
                eventStatus:
                  type: string
                category:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: "Ok. Event edited successfully."
        "400":
          description: "Bad Request. Invalid event data provided."
        "401":
          description: "Unauthorized. User must be authenticated to edit an event."
        "403":
          description: "Forbidden. Only the organizer must edit this event."
        "500":
          description: "Internal Server Error. An error occurred while processing the event editing."

  /events/{id}/inviteUsers:
    post:
      operationId: R205
      summary: "R205: Invite Users to Event"
      description: "Invite users to an event. Access: ORG"
      tags:
        - "M02: Events"
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: "Ok. Users invited successfully."
        "400":
          description: "Bad Request. Invalid user IDs provided."
        "401":
          description: "Unauthorized. User must be authenticated to invite users."
        "403":
          description: "Forbidden. Only the organizer must invite users to this event."
        "500":
          description: "Internal Server Error. An error occurred while processing the invitations."

  /events/{id}/removeUser:
    post:
      operationId: R206
      summary: "R206: Remove User from Event"
      description: "Remove a user from an event. Access: ORG"
      tags:
        - "M02: Events"
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                userId:
                  type: integer
      responses:
        "200":
          description: "Ok. User removed successfully."
        "400":
          description: "Bad Request. Invalid user ID provided."
        "401":
          description: "Unauthorized. User must be authenticated to remove users."
        "403":
          description: "Forbidden. Only the organizer must remove users from this event."
        "500":
          description: "Internal Server Error. An error occurred while processing the removal."

  /events/{id}/requestParticipation:
    post:
      operationId: R207
      summary: "R207: Request Participation in Event"
      description: "Request participation in an event. Access: USR"
      tags:
        - "M02: Events"
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: "Ok. Participation request sent successfully."
        "400":
          description: "Bad Request. Invalid event ID provided."
        "401":
          description: "Unauthorized. User must be authenticated to request participation."
        "403":
          description: "Forbidden. User cannot request participation in this event."
        "500":
          description: "Internal Server Error. An error occurred while processing the participation request."

  /events/{id}/cancelParticipation:
    post:
      operationId: R208
      summary: "R208: Cancel Participation in Event"
      description: "Cancel participation in an event. Access: USR"
      tags:
        - "M02: Events"
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: "Ok. Participation cancelled successfully."
        "400":
          description: "Bad Request. Invalid event ID provided."
        "401":
          description: "Unauthorized. User must be authenticated to cancel participation."
        "403":
          description: "Forbidden. User cannot cancel participation in this event."
        "500":
          description: "Internal Server Error. An error occurred while processing the cancellation."

  /events/{id}/attendees:
    get:
      operationId: R209
      summary: "R209: List Event Attendees"
      description: "Retrieve a list of attendees for a specific event. Access: ATT"
      tags:
        - "M02: Events"
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: "Ok. Return list of event attendees."
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: "John Doe"
                    email:
                      type: string
                      example: "john@exemple.com"
        "400":
          description: "Bad Request. Invalid event ID provided."
        "401":
          description: "Unauthorized. User must be authenticated to view attendees."
        "500":
          description: "Internal Server Error. An error occurred while retrieving the attendees."

  /events/{id}/delete:
    post:
      operationId: R210
      summary: "R210: Delete Event"
      description: "Delete a specific event. Access: ORG"
      tags:
        - "M02: Events"
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: "Ok. Event deleted successfully."
        "400":
          description: "Bad Request. Invalid event ID provided."
        "401":
          description: "Unauthorized. User must be authenticated to delete an event."
        "403":
          description: "Forbidden. Only the organizer must delete this event."

  /events/{id}/view:
    get:
      operationId: R211
      summary: "R211: View Event Details"
      description: "Show the details of a specific event. Access: PUB"
      tags:
        - "M02: Events"
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
                description:
                  type: string
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                capacity:
                  type: integer
                price:
                  type: number
                  format: float
                isPublic:
                  type: boolean
                location:
                  type: string
                createdby:
                  type: integer
                eventStatus:
                  type: string
                category:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: "Ok. Show Event Details UI"
        "404":
          description: "Not Found. Event with the specified ID does not exist."

  /events/{id}/updateStatus:
    post:
      operationId: R212
      summary: "R212: Update Event Status"
      description: "Update the status of a specific event. Access: ORG"
      tags:
        - "M02: Events"
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                eventStatus:
                  type: string
                  example:
                    eventStatus: "Completed"
      responses:
        "200":
          description: "Ok. Event status updated successfully."
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  eventStatus:
                    type: string
                    example: "Completed"
        "400":
          description: "Bad Request. Invalid event ID or status provided."
        "401":
          description: "Unauthorized. User must be authenticated to update event status."
        "403":
          description: "Forbidden. Only the organizer must update the status of this event."

  /events/{id}/acceptParticipation:
    post:
      operationId: R213
      summary: "R213: Accept Participation Request"
      description: "Accept a user participation request for an event. Access: ORG"
      tags:
        - "M02: Events"
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                userId:
                  type: integer
      responses:
        "200":
          description: "Ok. Participation request accepted successfully."
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId:
                    type: integer
                    example: 1
                  userId:
                    type: integer
                    example: 2
                  status:
                    type: string
                    example: "Accepted"
        "400":
          description: "Bad Request. Invalid event ID or user ID provided."
        "401":
          description: "Unauthorized. User must be authenticated to accept participation requests."
        "500":
          description: "Internal Server Error. An error occurred while processing the acceptance."

  /events/{id}/rejectParticipation:
    post:
      operationId: R214
      summary: "R214: Reject Participation Request"
      description: "Reject a user participation request for an event. Access: ORG"
      tags:
        - "M02: Events"
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                userId:
                  type: integer
      responses:
        "200":
          description: "Ok. Participation request rejected successfully."
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId:
                    type: integer
                    example: 1
                  userId:
                    type: integer
                    example: 2
                  status:
                    type: string
                    example: "Rejected"
        "400":
          description: "Bad Request. Invalid event ID or user ID provided."
        "401":
          description: "Unauthorized. User must be authenticated to reject participation requests."
        "500":
          description: "Internal Server Error. An error occurred while processing the rejection."

  /events/{id}/cancelEvent:
    post:
      operationId: R215
      summary: "R215: Cancel Event"
      description: "Cancel a specific event. Access: ORG"
      tags:
        - "M02: Events"
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                cancellationReason:
                  type: string
      responses:
        "200":
          description: "Ok. Event cancelled successfully."
        "400":
          description: "Bad Request. Invalid event ID provided."
        "401":
          description: "Unauthorized. User must be authenticated to cancel an event."
        "403":
          description: "Forbidden. Only the organizer must cancel this event."
        "500":
          description: "Internal Server Error. An error occurred while processing the cancellation."

  /events/{id}/eventStatistics:
    get:
      operationId: R216
      summary: "R216: Get Event Statistics"
      description: "Retrieve statistics for a specific event. Access: ORG"
      tags:
        - "M02: Events"
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: "Ok. Return event statistics."
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalAttendees:
                    type: integer
                    example: 150
                  totalRevenue:
                    type: number
                    format: float
                    example: 3000.00
                  averageRating:
                    type: number
                    format: float
                    example: 4.5
        "400":
          description: "Bad Request. Invalid event ID provided."
        "401":
          description: "Unauthorized. User must be authenticated to view event statistics."
        "403":
          description: "Forbidden. Only the organizer can view the statistics of this event."
        "500":
          description: "Internal Server Error. An error occurred while retrieving the statistics."

  /events/{id}/searchAttendees:
    get:
      operationId: R217
      summary: "R217: Filter list of Event Attendees"
      description: "Filter the list of participants by confirmed , not confirmed yet or rejected. Access: ORG"
      tags:
        - "M02: Events"
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
        - in: query
          name: status
          description: Filter attendees by status (confirmed, pending, rejected)
          schema:
            type: string
            enum: [confirmed, pending, rejected]
          required: false
      responses:
        "200":
          description: "Ok. Return filtered list of event attendees."
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: "John Doe"
                    email:
                      type: string
                      example: "john@example.com"
                    status:
                      type: string
                      example: "confirmed"
        "400":
          description: "Bad Request. Invalid event ID or status provided."
        "401":
          description: "Unauthorized . User must be authenticated to view attendees."
        "403":
          description: "Forbidden. Only the organizer can view the attendees of this event."
        "500":
          description: "Internal Server Error. An error occurred while retrieving the attendees."

  /events/{id}/leaveEvent:
    post:
      operationId: R218
