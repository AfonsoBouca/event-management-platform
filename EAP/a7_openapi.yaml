  /events/{id}/comments:
    get:
      operationId: R301
      summary: "R301: List Event Comments"
      description: "Retrieve all comments for a specific event. Access: PUB"
      tags:
        - "M03: Comments and Interactions"
      parameters:
        - in: path
          name: id
          description: Event ID
          schema:
            type: integer
          required: true
        - in: query
          name: parentId
          description: Filter comments by parent comment ID (for threaded replies)
          schema:
            type: integer
          required: false
      responses:
        "200":
          description: "Ok. Return list of comments."
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    commentId:
                      type: integer
                      example: 1
                    content:
                      type: string
                      example: "Great event! Looking forward to it."
                    createdAt:
                      type: string
                      format: date-time
                      example: "2025-11-18T10:30:00Z"
                    authorId:
                      type: integer
                      example: 5
                    authorName:
                      type: string
                      example: "John Doe"
                    eventId:
                      type: integer
                      example: 1
                    parentId:
                      type: integer
                      nullable: true
                      example: null
                    voteCount:
                      type: integer
                      example: 12
        "400":
          description: "Bad Request. Invalid event ID provided."
        "404":
          description: "Not Found. Event does not exist."
        "500":
          description: "Internal Server Error. An error occurred while retrieving comments."

    post:
      operationId: R302
      summary: "R302: Add Comment to Event"
      description: "Add a new comment to an event. Access: ATT, ORG"
      tags:
        - "M03: Comments and Interactions"
      parameters:
        - in: path
          name: id
          description: Event ID
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                content:
                  type: string
                  example: "This event looks amazing! Can't wait to attend."
                parentId:
                  type: integer
                  nullable: true
                  example: null
                  description: Parent comment ID for replies (null for top-level comments)
              required:
                - content
      responses:
        "201":
          description: "Created. Comment added successfully."
          content:
            application/json:
              schema:
                type: object
                properties:
                  commentId:
                    type: integer
                    example: 1
                  content:
                    type: string
                    example: "This event looks amazing! Can't wait to attend."
                  createdAt:
                    type: string
                    format: date-time
                    example: "2025-11-18T10:30:00Z"
                  authorId:
                    type: integer
                    example: 5
                  eventId:
                    type: integer
                    example: 1
                  parentId:
                    type: integer
                    nullable: true
                    example: null
        "400":
          description: "Bad Request. Invalid comment data, parent comment does not exist, or parent comment is deleted (BR17)."
        "401":
          description: "Unauthorized. User must be authenticated to add comments."
        "403":
          description: "Forbidden. Only event attendees and organizers can add comments (BR07)."
        "404":
          description: "Not Found. Event does not exist."
        "500":
          description: "Internal Server Error. An error occurred while adding the comment."

  /comments/{id}/edit:
    post:
      operationId: R303
      summary: "R303: Edit Comment"
