        "403":
          description: "Forbidden. Only the comment author can edit this comment (BR03)."
        "404":
          description: "Not Found. Comment does not exist."
        "500":
          description: "Internal Server Error. An error occurred while editing the comment."

  /comments/{id}/delete:
    post:
      operationId: R304
      summary: "R304: Delete Comment"
